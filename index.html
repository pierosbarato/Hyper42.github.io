<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XTFNWVMWB1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-XTFNWVMWB1');
</script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000; /* Sfondo nero per evitare flash bianchi */
            overflow: hidden;
        }

        /* Layout Desktop */
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .tab-content {
            flex: 1;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Navigazione Mobile DARK */
        .tabs-nav {
            display: none;
            background: #1a1a1a; /* Grigio molto scuro */
            border-bottom: 1px solid #333;
            height: 60px; /* Leggermente più alto per un tocco più moderno */
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: none;
            padding: 0;
            font-size: 13px;
            font-weight: 500;
            color: #888; /* Testo grigio per i tab inattivi */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #ffffff; /* Testo bianco per il tab attivo */
            background-color: #262626; /* Leggero stacco di sfondo */
            border-bottom: 3px solid #0a84ff; /* Blu elettrico in stile iOS Dark Mode */
        }

        /* Switch per Mobile */
        @media (max-width: 768px) {
            body {
                display: flex;
                flex-direction: column;
            }

            .tabs-nav {
                display: flex;
            }

            .container {
                flex: 1;
                display: block;
                height: calc(100vh - 60px);
            }

            .tab-content {
                display: none;
                height: 100%;
            }

            .tab-content.active {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="tabs-nav">
        <button class="tab-btn active" onclick="showTab(0)">Item</button>
        <button class="tab-btn" onclick="showTab(1)">Formula</button>
        <button class="tab-btn" onclick="showTab(2)">Form</button>
    </div>

    <div class="container">
        <div class="tab-content active">
            <iframe src="https://gqqhfd4g5qkxfmw73tf3sl4vgm0htxff.lambda-url.eu-central-1.on.aws/prompt.html" title="Item"></iframe>
        </div>

        <div class="tab-content">
            <iframe src="https://gqqhfd4g5qkxfmw73tf3sl4vgm0htxff.lambda-url.eu-central-1.on.aws/formula.html" title="Formula"></iframe>
        </div>

        <div class="tab-content">
            <iframe src="https://gqqhfd4g5qkxfmw73tf3sl4vgm0htxff.lambda-url.eu-central-1.on.aws/form.html" title="Form"></iframe>
        </div>
    </div>

    <script>
        function showTab(index) {
            const contents = document.querySelectorAll('.tab-content');
            const buttons = document.querySelectorAll('.tab-btn');

            contents.forEach((content, i) => {
                if(i === index) {
                    content.classList.add('active');
                    buttons[i].classList.add('active');
                } else {
                    content.classList.remove('active');
                    buttons[i].classList.remove('active');
                }
            });
        }
    </script>
</body>
</html>
